name: iPhone build and test
on:
  push:
    branches: ["claude/touch-share-ios"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode (uploads to TestFlight need Xcode 26 or later)
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: cd ios && xcodegen generate
      - name: Build and run the tests on an iPhone simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; c=sorted((rt,x["udid"]) for rt,v in d.items() if "iOS" in rt for x in v if "iPhone" in x["name"]); print(c[-1][1])')
          echo "simulator: $UDID"
          cd ios
          xcodebuild test -project TouchShare.xcodeproj -scheme TouchShare -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -60
