name: Build (dev branches)
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Core tests
        run: gradle :core:test --no-daemon
      - name: Remote share signaling tests
        run: node --test remote/test/core.test.mjs
      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Touch-Share-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
