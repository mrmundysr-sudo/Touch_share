plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// Address of the Anywhere matchmaker, supplied at build time (GitHub Actions variable or secret ANYWHERE_SERVER, or
// -PanywhereServer=...). It is deliberately not written in the source, which lives in a public repository.
def anywhereServer = (System.getenv('ANYWHERE_SERVER') ?: (project.findProperty('anywhereServer') ?: '')).toString().trim()

android {
    namespace 'com.touchshare.app'
    compileSdk 34
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.touchshare.app"
        buildConfigField 'String', 'ANYWHERE_SERVER', '"' + anywhereServer.replace('\\', '\\\\').replace('"', '\\"') + '"'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "0.5.0-anywhere2"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation project(':core')
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.webkit:webkit:1.12.1'   // loads the hidden Anywhere page from the app's assets over a secure origin
}

// The shared WebRTC script lives in remote/web/peer.js (used by the web pages too). Copy it into the app's assets at build time
// so there is one source of truth.
def remoteAssets = layout.buildDirectory.dir("generated/remoteAssets")
tasks.register('copyRemotePeer', Copy) {
    from("${rootDir}/remote/web/peer.js")
    into(remoteAssets.map { it.dir("remote") })
}
android.sourceSets.main.assets.srcDir(remoteAssets)
tasks.named('preBuild') { dependsOn 'copyRemotePeer' }
